name: 功能建议
description: 想要什么新功能或改进？
title: "[建议] 简短描述想法"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 感谢你的想法！请描述清楚需求场景，我们会评估。
  - type: textarea
    id: need
    attributes:
      label: 你想解决什么问题
      description: 你在什么场景下遇到了不便？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的设想
      description: 希望软件怎么帮你？越具体越好
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 写稿（正文生成/修订）
        - label: 资料管理（设定/角色/世界观）
        - label: 审稿/质检/入库
        - label: 界面体验
        - label: 桌面端打包/安装
        - label: 其他
